[project]
name = "melscrna"
version = "0.1.0"
description = "Tumour vs non-malignant cells in human melanoma single-cell RNA-seq (Tirosh et al. 2016), with Scanpy and inferred copy-number variation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Prithviraj Dasgupta" }]
license = { text = "MIT" }
dependencies = [
    "anndata>=0.10",
    "infercnvpy>=0.5",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
    "scanpy>=1.10",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/melscrna"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["melscrna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: long-running tests (deselect with -m \"not slow\")",
    "network: tests that need internet access (deselected in CI)",
]
